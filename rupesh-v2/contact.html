<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reach Us | Rupesh Ravu</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;display:block;padding:120px 5vw 48px;background:#090909;color:#f4f1eb;font-family:Inter,Arial,sans-serif}
  .contact-logo{position:absolute;top:17px;left:4vw;z-index:5;display:inline-flex;align-items:center}
  .contact-logo img{display:block;width:160px;height:40px;object-fit:contain}
  .contact-page{width:min(1180px,100%);margin:0 auto}
  .contact-intro{display:grid;grid-template-columns:1.2fr .8fr;align-items:end;gap:40px;padding-bottom:38px;border-bottom:1px solid rgba(255,255,255,.12)}
  .contact-page .kicker{margin-bottom:22px}
  .contact-page h1{font-size:clamp(64px,11vw,148px);line-height:.76;letter-spacing:-.09em;margin:0;text-transform:uppercase}
  .contact-page h1 span{color:#e83b25}
  .contact-lead{max-width:40ch;margin:0 0 4px;color:#b5afa7;font-size:clamp(16px,2vw,20px);line-height:1.7}
  .contact-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
  .contact-item{min-width:0;min-height:220px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));transition:transform .2s ease,border-color .2s ease,background .2s ease}
  .contact-item:hover{transform:translateY(-5px);border-color:#e83b25;background:linear-gradient(145deg,rgba(232,59,37,.16),rgba(255,255,255,.02))}
  .contact-item a{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:48px;width:100%;height:100%;padding:24px;color:inherit;text-decoration:none}
  .icon{width:54px;height:54px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);background:#111;color:#f4f1eb;font-size:22px;font-weight:700}
  .icon.instagram-icon{font-size:18px;line-height:1}
  .icon svg{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.8}
  .contact-item .label{display:block;margin-bottom:10px;color:#9d9a93;font:11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
  .contact-item .value{display:block;max-width:100%;overflow-wrap:anywhere;color:#f4f1eb;font-size:clamp(17px,2vw,22px);font-weight:700;letter-spacing:-.03em}
  .meta-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;padding:20px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
  .meta-row .meta-item{display:flex;justify-content:space-between;gap:16px;font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#d9d4ce}
  .meta-row .meta-item span:first-child{color:#9d9a93}
  .back-link{display:inline-block;margin-top:24px;font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#d9d4ce}
  .back-link:hover{color:#e83b25}
  @media (max-width: 800px){
    body{padding-top:110px}
    .contact-intro{grid-template-columns:1fr;gap:22px}
    .contact-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width: 540px){
    body{padding:100px 18px 34px}
    .contact-page h1{font-size:clamp(58px,16vw,86px)}
    .contact-list{grid-template-columns:1fr;gap:12px}
    .contact-item{grid-column:auto;min-height:190px}
    .contact-item a{padding:20px}
    .meta-row{grid-template-columns:1fr;gap:16px}
    .meta-row .meta-item{align-items:flex-start;flex-direction:column;gap:6px}
    .contact-logo{left:18px}
  }
</style>
</head>
<body>
  <a class="contact-logo" href="/" aria-label="RAVU.FX home"><img src="/api/site-logo" alt="RAVU.FX"></a>
  <main class="contact-page">
    <section class="contact-intro">
      <div>
        <p class="kicker">REACH US / CONTACT</p>
        <h1>LET'S<br><span>TALK.</span></h1>
      </div>
      <p class="contact-lead">Have a project in mind? Let’s connect and make something with impact.</p>
    </section>

    <div class="contact-list">
      <div class="contact-item">
        <a id="contactPhoneLink" href="https://wa.me/919502515671" target="_blank" rel="noreferrer"><span class="icon" aria-hidden="true">☎</span><span><span class="label">Phone / WhatsApp</span><span class="value" id="contactPhone">+91 950 251 5671</span></span></a>
      </div>
      <div class="contact-item">
        <a id="contactEmailLink" href="mailto:ravu.fx@gmail.com?subject=Project%20Inquiry"><span class="icon" aria-hidden="true">✉</span><span><span class="label">Email</span><span class="value" id="contactEmail">ravu.fx@gmail.com</span></span></a>
      </div>
      <div class="contact-item">
        <a id="contactInstagramLink" href="https://www.instagram.com/ravu.fx/" target="_blank" rel="noreferrer"><span class="icon instagram-icon" aria-label="Instagram icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"></circle>
          </svg>
        </span><span><span class="label">Instagram</span><span class="value" id="contactInstagram">@ravu.fx</span></span></a>
      </div>
      <div class="contact-item">
        <a href="https://www.linkedin.com/in/rupeshravu/" target="_blank" rel="noopener noreferrer" aria-label="Connect with Rupesh Ravu on LinkedIn">
          <span class="icon" aria-hidden="true">in</span>
          <span><span class="label">LinkedIn</span><span class="value">Connect with me ↗</span></span>
        </a>
      </div>
    </div>

    <div class="meta-row">
      <div class="meta-item"><span>Location</span><span>VIJAYAWADA, INDIA</span></div>
      <div class="meta-item"><span>Available</span><span>Internships / Freelance</span></div>
    </div>

    <a class="back-link" href="index.html">← Back to home</a>
  </main>
<script src="/contact.js" defer></script>
</body>
</html>
