<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reach Us | Rupesh Ravu</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#090909;color:#f4f1eb;font-family:Inter,Arial,sans-serif}
  .contact-page{max-width:760px;width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .contact-page .kicker{margin-bottom:18px}
  .contact-page h1{font-size:clamp(42px,7vw,90px);line-height:.8;letter-spacing:-.08em;margin:0 0 28px}
  .contact-list{display:grid;gap:18px;margin-top:20px}
  .contact-item{display:flex;align-items:center;gap:18px;padding:16px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);transition:transform .2s ease,border-color .2s ease}
  .contact-item:hover{transform:translateY(-2px);border-color:var(--accent, #e83b25)}
  .icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);background:#111;color:#f4f1eb;font-size:20px;font-weight:700}
  .icon.instagram-icon{font-size:18px;line-height:1}
  .icon svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.8}
  .contact-item a{display:flex;align-items:center;gap:18px;flex:1;color:inherit;text-decoration:none;font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
  .contact-item .label{color:#9d9a93;min-width:130px}
  .contact-item .value{color:#f4f1eb}
  .meta-row{margin-top:24px;display:grid;gap:12px}
  .meta-row .meta-item{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#d9d4ce}
  .meta-row .meta-item span:first-child{color:#9d9a93}
  .back-link{display:inline-block;margin-top:24px;font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#d9d4ce}
  .back-link:hover{color:#e83b25}
  @media (max-width: 600px){
    .contact-page{padding:28px 20px}.contact-item a{flex-direction:column;align-items:flex-start;gap:8px}.contact-item .label{min-width:0}.icon{width:38px;height:38px}.meta-row .meta-item{grid-template-columns:1fr;gap:6px}.meta-row .meta-item span:first-child{display:block;margin-bottom:6px}
  }
</style>
</head>
<body>
  <main class="contact-page">
    <p class="kicker">REACH US / CONTACT</p>
    <h1>LET'S<br><span style="color:#e83b25">TALK.</span></h1>

    <div class="contact-list">
      <div class="contact-item">
        <div class="icon">☎</div>
        <a href="https://wa.me/919502515671" target="_blank" rel="noreferrer"><span class="label">Phone</span><span class="value">+91 950 251 5671</span></a>
      </div>
      <div class="contact-item">
        <div class="icon">✉</div>
        <a href="mailto:ravu.fx@gmail.com?subject=Project%20Inquiry"><span class="label">Email</span><span class="value">ravu.fx@gmail.com</span></a>
      </div>
      <div class="contact-item">
        <div class="icon instagram-icon" aria-label="Instagram icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <a href="https://www.instagram.com/ravu.fx/" target="_blank" rel="noreferrer"><span class="label">Instagram</span><span class="value">@ravu.fx</span></a>
      </div>
    </div>

    <div class="meta-row">
      <div class="meta-item"><span>Location</span><span>INDIA</span></div>
      <div class="meta-item"><span>Available</span><span>Internships / Freelance</span></div>
    </div>

    <a class="back-link" href="index.html">← Back to home</a>
  </main>
</body>
</html>
