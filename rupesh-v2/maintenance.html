<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maintenance - Ravu.FX</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; color: #171717; }
    main { width: min(680px, calc(100% - 48px)); text-align: center; }
    .mark { margin: 0 0 28px; font-size: 12px; letter-spacing: .24em; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(48px, 10vw, 104px); line-height: .88; letter-spacing: -.065em; text-transform: uppercase; }
    h1 em { display: block; color: #6f6f68; font-family: Georgia, serif; font-weight: 400; }
    p { max-width: 480px; margin: 32px auto 0; font-size: 17px; line-height: 1.6; color: #50504a; }
  </style>
</head>
<body>
  <main>
    <div class="mark">RAVU.FX / PORTFOLIO</div>
    <h1>UNDER <em>MAINTENANCE</em></h1>
    <p>We are making a few updates. The portfolio will be back shortly.</p>
  </main>
</body>
</html>
